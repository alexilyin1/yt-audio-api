<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube to MP3</title>
<link rel="stylesheet" href="/static/common.css">
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f7; margin: 0; padding: 2rem 1rem; color: #222; }
  main { max-width: 560px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { margin-top: 0; font-size: 1.5rem; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: .75rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 8px; }
  #simlist li { margin-bottom: .6rem; }
  #sim:disabled { background: #ccc !important; cursor: not-allowed; }
  #status { margin-top: 1.25rem; min-height: 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>🎧 YouTube to MP3</h1>
  <label for="url">Paste a YouTube link:</label>
  <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autofocus>
  <button id="go">Convert to MP3</button>
  <button id="sim" disabled style="background:#1db954;margin-left:.5rem">Find similar songs</button>
  <div id="simhint" style="font-size:.85rem;color:#666;margin-top:.5rem"></div>
  <ol id="simlist"></ol>
  <div id="status" aria-live="polite"></div>
  <hr style="margin:2rem 0;border:0;border-top:1px solid #ddd">
  <h2 style="font-size:1.15rem">Import a list of songs</h2>
  <p style="font-size:.9rem;color:#555">Paste song names (one per line, or separated by commas, tabs, semicolons) or choose a .txt / .csv file (up to 100 songs).</p>
  <textarea id="imptext" rows="5" style="width:100%;box-sizing:border-box;padding:.75rem;font-size:1rem;border:1px solid #bbb;border-radius:8px" placeholder="Bohemian Rhapsody&#10;Africa&#10;Take on Me"></textarea>
  <input id="impfile" type="file" accept=".txt,.csv,text/plain,text/csv" style="margin-top:.5rem">
  <br><button id="imp" style="background:#1565c0">Find these songs</button>
  <button id="impsim" disabled style="background:#1db954;margin-left:.5rem">Find similar songs →</button>
  <div id="impsimhint" style="font-size:.85rem;color:#666;margin-top:.5rem"></div>
  <div id="imphint" style="font-size:.85rem;color:#666;margin-top:.5rem" aria-live="polite"></div>
  <div id="impnotes"></div>
  <div id="impactions" style="margin-top:.75rem"></div>
  <ol id="implist"></ol>
  <p style="margin-top:2rem"><a href="/spotify">Set up Spotify song recommendations →</a></p>
  <p id="quitrow" hidden style="font-size:.85rem"><a href="#" id="quit">Quit YT Audio</a></p>
</main>
<script src="/static/common.js"></script>
<script>
const urlBox = document.getElementById('url');
const btn = document.getElementById('go');
const status = document.getElementById('status');


function showError(msg) {
  status.innerHTML = '<span class="error"></span>';
  status.firstChild.textContent = msg;
}

async function convert() {
  const url = urlBox.value.trim();
  if (!url) { showError('Please paste a YouTube link first.'); return; }
  btn.disabled = true;
  status.innerHTML = '<div id="label"></div><progress id="bar" max="100" value="0"></progress>';
  const label = document.getElementById('label');
  const bar = document.getElementById('bar');
  try {
    const token = await runConversion(url, (text, percent) => {
      label.textContent = text;
      if (percent === null) bar.removeAttribute('value'); else bar.value = percent;
    });
    status.replaceChildren(downloadLink(token));
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
  }
}

const sim = document.getElementById('sim');
const simHint = document.getElementById('simhint');
const simList = document.getElementById('simlist');

// Similar songs needs the Spotify keys; stay greyed out until they are saved
fetch('/spotify/status').then(r => r.json()).then(d => {
  spotifyReady = d.configured;
  document.getElementById('impsim').disabled = !d.configured;
  document.getElementById('impsimhint').innerHTML = d.configured ? '' : 'To find similar songs, <a href="/spotify">set up Spotify first</a>.';
  sim.disabled = !d.configured;
  simHint.innerHTML = d.configured ? '' : 'To find similar songs, <a href="/spotify">set up Spotify first</a>.';
}).catch(() => {});

sim.addEventListener('click', async () => {
  const url = urlBox.value.trim();
  simList.innerHTML = '';
  if (!url) { simHint.textContent = 'Please paste a YouTube link first.'; return; }
  sim.disabled = true;
  simHint.textContent = 'Looking up songs…';
  try {
    const res = await fetch('/similar?url=' + encodeURIComponent(url));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    simHint.textContent = 'Songs like ' + data.song + ':';
    data.similar.forEach(song => simList.appendChild(songRow(song)));
  } catch (e) {
    simHint.textContent = e.message;
  } finally {
    sim.disabled = false;
  }
});

// Sends the imported songs to the page that finds similar songs for each of them
function similarForListButton(queries) {
  const wrap = document.createElement('div');
  wrap.style.marginTop = '.75rem';
  const button = document.createElement('button');
  button.style.cssText = 'background:#1db954;margin-top:0';
  button.textContent = '🎵 Find similar songs for these ' + queries.length;
  button.disabled = !spotifyReady;
  button.addEventListener('click', () => {
    try {
      sessionStorage.setItem('bulkQueries', JSON.stringify(queries));
      sessionStorage.removeItem('bulkInfo');
    } catch (e) {}
    location.href = '/bulk-similar';
  });
  wrap.appendChild(button);
  if (!spotifyReady) {
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:.85rem;color:#666;margin-top:.5rem';
    hint.innerHTML = 'To find similar songs, <a href="/spotify">set up Spotify first</a>.';
    wrap.appendChild(hint);
  }
  return wrap;
}

// Import: a chosen file fills the text box, then "Find these songs" looks up each one
const imp = document.getElementById('imp');
const impText = document.getElementById('imptext');
const impHint = document.getElementById('imphint');
const impList = document.getElementById('implist');
const impActions = document.getElementById('impactions');
const impNotes = document.getElementById('impnotes');
let spotifyReady = false;  // set from /spotify/status below

document.getElementById('impfile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { impText.value = reader.result; };
  reader.readAsText(file);
});

// Shows the notice box under the import
function showImportNotes(headline, tip, skipped, severe) {
  impNotes.replaceChildren();
  const box = noticeBox(headline, tip, skipped, severe);
  if (box) impNotes.appendChild(box);
}

imp.addEventListener('click', async () => {
  impList.innerHTML = '';
  impActions.replaceChildren();
  impNotes.replaceChildren();
  if (!impText.value.trim()) { impHint.textContent = 'Paste some song names or choose a file first.'; return; }
  imp.disabled = true;
  impHint.textContent = 'Looking up songs… this can take a little while for long lists.';
  try {
    const res = await fetch('/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: impText.value }),
    });
    const data = await res.json();
    if (!res.ok) {
      impHint.textContent = '';
      showImportNotes(data.error || 'Something went wrong.', '', data.skipped || [], true);
      return;
    }
    const songs = data.songs;
    const notFound = songs.filter(s => s.status === 'notfound');
    const unsure = songs.filter(s => s.status === 'unsure');
    const skipped = data.skipped;
    const problems = notFound.length + unsure.length + skipped.length;
    let msg = 'Found ' + songs.length + ' song' + (songs.length === 1 ? '' : 's') + ':';
    if (data.found > data.limit) msg = 'Your list has ' + data.found + ' songs; using the first ' + data.limit + '. ' + msg;
    impHint.textContent = msg;

    songs.forEach(song => {
      const li = songRow(song);
      if (song.hint) li.appendChild(problemNote(song.status, (song.status === 'notfound' ? 'You entered "' + song.query + '". ' : '') + song.hint));
      impList.appendChild(li);
    });

    if (problems) {
      const bad = notFound.length + skipped.length;
      const total = songs.length + skipped.length;
      const severe = bad * 2 >= total;
      const headline = severe
        ? 'Most of your list couldn\'t be matched (' + bad + ' of ' + total + ' entries). Please check it and try again.'
        : problems + ' of ' + total + ' entries need a look' + (unsure.length ? ' ("Check this match" means we guessed).' : '.');
      showImportNotes(headline, data.tip, skipped, severe);
    }

    const downloadable = songs.filter(s => s.url);
    if (downloadable.length > 1) impActions.appendChild(zipButton(downloadable));
    const lookable = songs.filter(s => s.status !== 'notfound').map(s => s.query);
    if (lookable.length) impActions.appendChild(similarForListButton(lookable));
  } catch (e) {
    impHint.textContent = e.message;
  } finally {
    imp.disabled = false;
  }
});

// "Find similar songs →": skip the download links and go straight to the similar songs page
const impSim = document.getElementById('impsim');
impSim.addEventListener('click', async () => {
  impNotes.replaceChildren();
  if (!impText.value.trim()) { impHint.textContent = 'Paste some song names or choose a file first.'; return; }
  impSim.disabled = true;
  try {
    const res = await fetch('/import/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: impText.value }),
    });
    const data = await res.json();
    if (!res.ok) {
      impHint.textContent = '';
      showImportNotes(data.error || 'Something went wrong.', '', data.skipped || [], true);
      impSim.disabled = false;
      return;
    }
    try {
      sessionStorage.setItem('bulkQueries', JSON.stringify(data.queries));
      sessionStorage.setItem('bulkInfo', JSON.stringify({ found: data.found, limit: data.limit, skipped: data.skipped, tip: data.tip }));
    } catch (e) {}
    location.href = '/bulk-similar';
  } catch (e) {
    impHint.textContent = e.message;
    impSim.disabled = false;
  }
});

// Only the desktop app has a Quit link; there is no terminal to close
fetch('/app-info').then(r => r.json()).then(d => {
  document.getElementById('quitrow').hidden = !d.desktop;
}).catch(() => {});
document.getElementById('quit').addEventListener('click', async e => {
  e.preventDefault();
  try { await fetch('/quit', { method: 'POST' }); } catch (err) {}
  document.body.innerHTML = '<main><h1>YT Audio has quit.</h1><p>You can close this tab.</p></main>';
});

btn.addEventListener('click', convert);
urlBox.addEventListener('keydown', e => { if (e.key === 'Enter') convert(); });
</script>
</body>
</html>
